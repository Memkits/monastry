name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify MoonBit and Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          node --version
          yarn --version
          moon version --all

      - name: Update MoonBit package index
        run: moon update

      - name: Check MoonBit sources
        run: yarn check

      - name: Run test suites
        run: yarn test

      - name: Build Respo frontend
        run: yarn build

      - name: Verify generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
